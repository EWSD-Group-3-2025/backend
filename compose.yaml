services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/e_tutoring_system_db
      SPRING_DATASOURCE_USERNAME: group_3
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"

  mysql:
    image: "mysql:8.0"
    environment:
      - "MYSQL_DATABASE=e_tutoring_system_db"
      - "MYSQL_ROOT_PASSWORD=mysql"
      - "MYSQL_PASSWORD=mysql"
      - "MYSQL_USER=group_3"
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "--password=mysql",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
